name: Build & Publish APK Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore & Environment
        run: |
          touch .env
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            # Generate a valid debug keystore if not present
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Prepare Release Artifacts
        id: prepare_artifact
        run: |
          VERSION="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version_name }}"
          fi
          OUTPUT_APK="app/build/outputs/apk/debug/app-debug.apk"
          DEST_APK="monovox-voice-ai-${VERSION}.apk"
          cp "$OUTPUT_APK" "$DEST_APK"
          echo "tag_name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_path=${DEST_APK}" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_artifact.outputs.tag_name }}
          name: Monovox Voice AI ${{ steps.prepare_artifact.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.prepare_artifact.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
